# ============================================================
# Akilent Production Nginx Configuration
# ============================================================

# ------------------------------------------------------------
# Docker DNS
# ------------------------------------------------------------
resolver 127.0.0.11 valid=30s;


# ------------------------------------------------------------
# Cloudflare Real Client IP
#
# Cloudflare terminates the public connection and forwards the
# original client IP using CF-Connecting-IP.
#
# IMPORTANT:
# Only trust this header from Cloudflare's published IP ranges.
# ------------------------------------------------------------
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Cloudflare IPv4 ranges
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 ranges
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;


# ------------------------------------------------------------
# Request Rate Limiting
#
# These are SECONDARY protections.
#
# Cloudflare should provide the primary edge rate limiting.
# Django should provide user/org/API-key aware limits.
# Nginx provides infrastructure-level protection here.
# ------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_status 429;


# ------------------------------------------------------------
# HTTP → HTTPS
# ------------------------------------------------------------
server {
    listen 80;
    server_name akilent.com www.akilent.com;
    return 301 https://$host$request_uri;
}


# ============================================================
# HTTPS
# ============================================================
server {
    listen 443 ssl;
    server_name akilent.com www.akilent.com;

    server_tokens off;

    # --------------------------------------------------------
    # TLS
    # --------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/akilent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akilent.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Optional — enable after HTTPS is fully verified everywhere
    # ssl_stapling on;
    # ssl_stapling_verify on;


    # --------------------------------------------------------
    # Request / Connection Limits
    # --------------------------------------------------------
    client_max_body_size 26M;  # inbox media uploads: Instagram video limit is 25 MB

    client_header_timeout 15s;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    send_timeout 30s;


    # --------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------
    # Referrer-Policy only — X-Frame-Options and X-Content-Type-Options are
    # set by Django SecurityMiddleware; duplicating them here sends each header
    # twice, violating RFC 7034 and risking rejection by HTTP/2 intermediaries.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS is already set by Django in production (SECURE_HSTS_*).
    # Do not duplicate it here.


    # ========================================================
    # Server-Sent Events
    #
    # Events service runs separately from Django's WSGI web
    # service so long-lived connections don't consume WSGI
    # workers.
    #
    # IMPORTANT:
    # Do not apply the normal rate limit to SSE connections.
    # ========================================================
    location /events/ {
        set $events_upstream http://events:8001;
        proxy_pass $events_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requires buffering to be disabled
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Long-lived connection
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }


    # ========================================================
    # Authentication
    #
    # Matches Django LOGIN_URL = "/auth/login/"
    # Also covers logout, password reset, and signup paths.
    # ========================================================
    location ~ ^/auth/(login|logout|password|signup)/ {
        # burst=2 without nodelay: excess requests are queued and delayed
        # rather than served immediately, preventing rapid-fire brute-force
        # attempts from consuming the burst allowance in one shot.
        limit_req zone=auth burst=2;

        set $upstream http://web:8000;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ========================================================
    # Webhooks
    #
    # Webhooks are intentionally NOT subjected to the normal
    # human/browser rate limit.
    #
    # Provider signature verification MUST still happen inside
    # Django.
    #
    # Cloudflare should have separate rules for these endpoints
    # where appropriate.
    # ========================================================
    location /webhooks/ {
        set $upstream http://web:8000;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ========================================================
    # General Application
    #
    # Nginx-level infrastructure protection.
    #
    # Cloudflare should provide the primary edge protection.
    # Django should provide application/user/tenant limits.
    # ========================================================
    location / {
        limit_req zone=general burst=40 nodelay;

        set $upstream http://web:8000;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}