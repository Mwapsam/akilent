resolver 127.0.0.11 valid=30s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name akilent.com www.akilent.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name akilent.com www.akilent.com;

    ssl_certificate /etc/letsencrypt/live/akilent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akilent.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # apps/core/views_events.py's SSE stream, on its own ASGI service (docker-compose.yml's
    # `events`) — not `web` — so it never ties up a WSGI worker for as long as a browser tab
    # stays open. Buffering off and a long read timeout are both required for SSE to actually
    # stream rather than arrive all at once (or get killed) at the proxy.
    location /events/ {
        set $events_upstream http://events:8001;
        proxy_pass $events_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}