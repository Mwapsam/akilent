name: Bandit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tools
        run: pip install "bandit==1.9.4" pip-audit "poetry==2.1.3" "poetry-plugin-export==1.9.0"

      - name: Export dependencies for audit
        run: poetry export -f requirements.txt --without-hashes --output /tmp/audit-reqs.txt

      - name: Audit dependencies
        run: pip-audit -r /tmp/audit-reqs.txt

      - name: Run Bandit
        run: |
          bandit -r . \
            -ll \
            -ii \
            --exclude ./.venv,./staticfiles,./media,./node_modules \
            -c pyproject.toml \
            -f sarif \
            -o bandit.sarif

      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
