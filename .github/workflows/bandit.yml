name: Bandit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Poetry
        run: pip install poetry

      - name: Install project
        run: poetry install --no-interaction --no-root

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --path "$(poetry env info --path)"

      - name: Run Bandit
        run: |
          poetry run bandit -r . \
            -ll \
            -ii \
            --exclude ./.venv,./staticfiles,./media,./node_modules \
            -c pyproject.toml

      # The repository is private without GitHub Code Security, so the report is kept
      # with the run rather than uploaded to the Security tab.
      - name: Save Bandit report
        if: always()
        run: |
          poetry run pip install bandit-sarif-formatter
          poetry run bandit -r . \
            -ll \
            -ii \
            --exclude ./.venv,./staticfiles,./media,./node_modules \
            -c pyproject.toml \
            -f sarif \
            -o bandit.sarif \
            --exit-zero

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit.sarif
          if-no-files-found: ignore
