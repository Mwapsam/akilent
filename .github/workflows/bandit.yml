name: Bandit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Poetry
        run: pip install poetry

      - name: Install project
        run: poetry install --no-interaction --no-root

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --path "$(poetry env info --path)"

      - name: Run Bandit
        run: |
          poetry run pip install bandit-sarif-formatter
          poetry run bandit -r . \
            -ll \
            -ii \
            --exclude ./.venv,./staticfiles,./media,./node_modules \
            -c pyproject.toml \
            -f sarif \
            -o bandit.sarif

      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
