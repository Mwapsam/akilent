name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    environment: .env
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      # The exact commit to release: the one CI tested, never whatever main is by now.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require a green CI run for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "${{ github.repository }}" --workflow CI \
            --commit "$DEPLOY_SHA" --limit 1 --json conclusion -q '.[0].conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "CI has not passed for $DEPLOY_SHA (latest run: ${conclusion:-none}); not deploying."
            exit 1
          fi

      - name: Check required secrets are set
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          INSTAGRAM_VERIFY_TOKEN: ${{ secrets.INSTAGRAM_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET || secrets.WHATSAPP_APP_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
        run: |
          # An unset secret reaches the server as NAME= and the app either refuses to start
          # or silently runs with the feature off. Fail here, before anything is touched.
          missing=""
          for name in DJANGO_SECRET_KEY ALLOWED_HOSTS POSTGRES_PASSWORD FIELD_ENCRYPTION_KEY \
                      INSTAGRAM_VERIFY_TOKEN META_APP_SECRET SSH_HOST DEPLOY_PATH; do
            eval "value=\${$name:-}"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Required secrets are empty:$missing"
            exit 1
          fi
          # Not fatal, but production shouldn't run without them for long.
          [ -z "$SENTRY_DSN" ] && echo "::warning::SENTRY_DSN is empty: errors are not reported anywhere."
          [ -z "$BACKUP_S3_BUCKET" ] && echo "::warning::BACKUP_S3_BUCKET is empty: the database is not being backed up."
          [ -z "$BACKUP_AWS_ACCESS_KEY_ID" ] && echo "::warning::BACKUP_AWS_ACCESS_KEY_ID is not set: backups use the main AWS keys."
          true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEBUG: ${{ secrets.DEBUG }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          USE_SQLITE: ${{ secrets.USE_SQLITE }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_CACHE_URL: ${{ secrets.REDIS_CACHE_URL }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
          CELERY_RESULT_BACKEND: ${{ secrets.CELERY_RESULT_BACKEND }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          WHATSAPP_ENABLED: ${{ secrets.WHATSAPP_ENABLED }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_APP_ID: ${{ secrets.WHATSAPP_APP_ID }}
          WHATSAPP_CONFIG_ID: ${{ secrets.WHATSAPP_CONFIG_ID }}
          WHATSAPP_GRAPH_VERSION: ${{ secrets.WHATSAPP_GRAPH_VERSION }}
          STALWART_API_BASE: ${{ secrets.STALWART_API_BASE }}
          STALWART_API_KEY: ${{ secrets.STALWART_API_KEY }}
          MAIL_PROVIDER_BACKEND: ${{ secrets.MAIL_PROVIDER_BACKEND }}
          EMAIL_SEND_PROVIDER_BACKEND: ${{ secrets.EMAIL_SEND_PROVIDER_BACKEND }}
          BASE_DOMAIN: ${{ secrets.BASE_DOMAIN }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_USE_SSL: ${{ secrets.EMAIL_USE_SSL }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_REGION_NAME: ${{ secrets.AWS_REGION }}
          AWS_CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}
          CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_ID }}
          AWS_STORAGE_BUCKET_NAME: ${{ secrets.AWS_STORAGE_BUCKET_NAME }}
          SES_CONFIGURATION_SET: ${{ secrets.SES_CONFIGURATION_SET }}
          SES_SNS_TOPIC_ARN: ${{ secrets.SES_SNS_TOPIC_ARN }}
          FLUTTERWAVE_SECRET_KEY: ${{ secrets.FLUTTERWAVE_SECRET_KEY }}
          FLUTTERWAVE_WEBHOOK_HASH: ${{ secrets.FLUTTERWAVE_WEBHOOK_HASH }}
          FLUTTERWAVE_CURRENCY: ${{ secrets.FLUTTERWAVE_CURRENCY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}
          GUNICORN_WORKERS: ${{ secrets.GUNICORN_WORKERS }}
          GUNICORN_TIMEOUT: ${{ secrets.GUNICORN_TIMEOUT }}
          GUNICORN_MAX_REQUESTS: ${{ secrets.GUNICORN_MAX_REQUESTS }}
          GUNICORN_MAX_REQUESTS_JITTER: ${{ secrets.GUNICORN_MAX_REQUESTS_JITTER }}
          REALTIME_SSE_ENABLED: ${{ secrets.REALTIME_SSE_ENABLED }}
          TASKCENTRO_DEBUG_TOKEN: ${{ secrets.TASKCENTRO_DEBUG_TOKEN }}
          INTERNAL_DEBUG_ENABLED: ${{ secrets.INTERNAL_DEBUG_ENABLED }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CURRENCY: ${{ secrets.STRIPE_CURRENCY }}
          BILLING_CURRENCY: ${{ secrets.BILLING_CURRENCY }}
          # PayPal (docs/billing/paypal/CONTRACT.md). PAYPAL_ENV must be "sandbox" or "live";
          # sandbox on this server (DEBUG off) also needs PAYPAL_ALLOW_SANDBOX=true.
          PAYPAL_ENV: ${{ secrets.PAYPAL_ENV }}
          PAYPAL_ALLOW_SANDBOX: ${{ secrets.PAYPAL_ALLOW_SANDBOX }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          PAYPAL_MERCHANT_ID: ${{ secrets.PAYPAL_MERCHANT_ID }}
          PAYPAL_CURRENCIES: ${{ secrets.PAYPAL_CURRENCIES }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          AI_PROVIDER_BACKEND: ${{ secrets.AI_PROVIDER_BACKEND }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_TIMEOUT_SECONDS: ${{ secrets.AI_TIMEOUT_SECONDS }}
          AI_DAILY_CALL_LIMIT: ${{ secrets.AI_DAILY_CALL_LIMIT }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          AI_MODEL_FAST: ${{ secrets.AI_MODEL_FAST }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          AI_AUTONOMY_ENABLED: ${{ secrets.AI_AUTONOMY_ENABLED }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          # Backups should use keys that can only reach the backup bucket (docs/ops/backups.md);
          # the main AWS keys are the fallback until BACKUP_AWS_* secrets exist.
          BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          SEO_ALLOW_INDEXING: ${{ secrets.SEO_ALLOW_INDEXING }}
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          INSTAGRAM_GRAPH_VERSION: ${{ secrets.INSTAGRAM_GRAPH_VERSION }}
          INSTAGRAM_VERIFY_TOKEN: ${{ secrets.INSTAGRAM_VERIFY_TOKEN }}
          HUBSPOT_CLIENT_ID: ${{ secrets.HUBSPOT_CLIENT_ID }}
          HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
          SYSTEM_EMAIL_PROVIDER_BACKEND: ${{ secrets.SYSTEM_EMAIL_PROVIDER_BACKEND }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: >-
            DEBUG,DJANGO_SECRET_KEY,ALLOWED_HOSTS,CSRF_TRUSTED_ORIGINS,
            POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_HOST,POSTGRES_PORT,USE_SQLITE,
            REDIS_PASSWORD,REDIS_CACHE_URL,
            RABBITMQ_USER,RABBITMQ_PASS,
            CELERY_BROKER_URL,CELERY_RESULT_BACKEND,
            FIELD_ENCRYPTION_KEY,
            WHATSAPP_ENABLED,
            WHATSAPP_VERIFY_TOKEN,WHATSAPP_APP_SECRET,WHATSAPP_APP_ID,WHATSAPP_CONFIG_ID,WHATSAPP_GRAPH_VERSION,
            STALWART_API_BASE,STALWART_API_KEY,MAIL_PROVIDER_BACKEND,EMAIL_SEND_PROVIDER_BACKEND,BASE_DOMAIN,
            EMAIL_HOST,EMAIL_PORT,EMAIL_HOST_USER,EMAIL_HOST_PASSWORD,EMAIL_USE_TLS,EMAIL_USE_SSL,DEFAULT_FROM_EMAIL,
            AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,SES_CONFIGURATION_SET,SES_SNS_TOPIC_ARN,
            FLUTTERWAVE_SECRET_KEY,FLUTTERWAVE_WEBHOOK_HASH,FLUTTERWAVE_CURRENCY,
            SLACK_WEBHOOK_URL,
            SENTRY_DSN,SENTRY_ENVIRONMENT,SENTRY_TRACES_SAMPLE_RATE,
            GUNICORN_WORKERS,GUNICORN_TIMEOUT,GUNICORN_MAX_REQUESTS,GUNICORN_MAX_REQUESTS_JITTER,REALTIME_SSE_ENABLED,
            TASKCENTRO_DEBUG_TOKEN,INTERNAL_DEBUG_ENABLED,
            AWS_S3_REGION_NAME,AWS_CLOUDFRONT_DOMAIN,CLOUDFRONT_ID,AWS_STORAGE_BUCKET_NAME,
            STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_CURRENCY,BILLING_CURRENCY,
            PAYPAL_ENV,PAYPAL_ALLOW_SANDBOX,PAYPAL_CLIENT_ID,PAYPAL_CLIENT_SECRET,PAYPAL_WEBHOOK_ID,
            PAYPAL_MERCHANT_ID,PAYPAL_CURRENCIES,
            OLLAMA_API_KEY,AI_PROVIDER_BACKEND,AI_MODEL,AI_TIMEOUT_SECONDS,AI_DAILY_CALL_LIMIT,OLLAMA_BASE_URL,
            AI_MODEL_FAST,ANTHROPIC_API_KEY,OPENAI_API_KEY,OPENAI_BASE_URL,AI_AUTONOMY_ENABLED,
            BACKUP_S3_BUCKET,BACKUP_AWS_ACCESS_KEY_ID,BACKUP_AWS_SECRET_ACCESS_KEY,SEO_ALLOW_INDEXING,GOOGLE_ANALYTICS_ID,
            INSTAGRAM_APP_ID,INSTAGRAM_APP_SECRET,INSTAGRAM_GRAPH_VERSION,INSTAGRAM_VERIFY_TOKEN,
            HUBSPOT_CLIENT_ID,HUBSPOT_CLIENT_SECRET,SYSTEM_EMAIL_PROVIDER_BACKEND,
            DEPLOY_SHA
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            PREV=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard "$DEPLOY_SHA"

            # Rebuild .env on the server from the GitHub secrets forwarded above -
            # secrets are the source of truth, not any hand-edited server copy.
            cat > .env <<ENVEOF
            DEBUG=$DEBUG
            DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY
            ALLOWED_HOSTS=$ALLOWED_HOSTS
            CSRF_TRUSTED_ORIGINS=$CSRF_TRUSTED_ORIGINS
            MFA_ENFORCEMENT_ENABLED=1
            POSTGRES_DB=$POSTGRES_DB
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_HOST=$POSTGRES_HOST
            POSTGRES_PORT=$POSTGRES_PORT
            USE_SQLITE=$USE_SQLITE
            REDIS_PASSWORD=$REDIS_PASSWORD
            REDIS_CACHE_URL=$REDIS_CACHE_URL
            RABBITMQ_USER=$RABBITMQ_USER
            RABBITMQ_PASS=$RABBITMQ_PASS
            CELERY_BROKER_URL=$CELERY_BROKER_URL
            CELERY_RESULT_BACKEND=$CELERY_RESULT_BACKEND
            FIELD_ENCRYPTION_KEY=$FIELD_ENCRYPTION_KEY
            WHATSAPP_ENABLED=$WHATSAPP_ENABLED
            WHATSAPP_VERIFY_TOKEN=$WHATSAPP_VERIFY_TOKEN
            WHATSAPP_APP_SECRET=$WHATSAPP_APP_SECRET
            WHATSAPP_APP_ID=$WHATSAPP_APP_ID
            WHATSAPP_CONFIG_ID=$WHATSAPP_CONFIG_ID
            WHATSAPP_GRAPH_VERSION=$WHATSAPP_GRAPH_VERSION
            STALWART_API_BASE=$STALWART_API_BASE
            STALWART_API_KEY=$STALWART_API_KEY
            MAIL_PROVIDER_BACKEND=$MAIL_PROVIDER_BACKEND
            EMAIL_SEND_PROVIDER_BACKEND=$EMAIL_SEND_PROVIDER_BACKEND
            BASE_DOMAIN=$BASE_DOMAIN
            EMAIL_HOST=$EMAIL_HOST
            EMAIL_PORT=$EMAIL_PORT
            EMAIL_HOST_USER=$EMAIL_HOST_USER
            EMAIL_HOST_PASSWORD=$EMAIL_HOST_PASSWORD
            EMAIL_USE_TLS=$EMAIL_USE_TLS
            EMAIL_USE_SSL=$EMAIL_USE_SSL
            DEFAULT_FROM_EMAIL=$DEFAULT_FROM_EMAIL
            AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            AWS_REGION=$AWS_S3_REGION_NAME
            AWS_S3_REGION_NAME=$AWS_S3_REGION_NAME
            AWS_CLOUDFRONT_DOMAIN=$AWS_CLOUDFRONT_DOMAIN
            CLOUDFRONT_ID=$CLOUDFRONT_ID
            AWS_STORAGE_BUCKET_NAME=$AWS_STORAGE_BUCKET_NAME
            SES_CONFIGURATION_SET=$SES_CONFIGURATION_SET
            SES_SNS_TOPIC_ARN=$SES_SNS_TOPIC_ARN
            FLUTTERWAVE_SECRET_KEY=$FLUTTERWAVE_SECRET_KEY
            FLUTTERWAVE_WEBHOOK_HASH=$FLUTTERWAVE_WEBHOOK_HASH
            FLUTTERWAVE_CURRENCY=$FLUTTERWAVE_CURRENCY
            SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL
            SENTRY_DSN=$SENTRY_DSN
            SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT
            SENTRY_TRACES_SAMPLE_RATE=$SENTRY_TRACES_SAMPLE_RATE
            GUNICORN_WORKERS=$GUNICORN_WORKERS
            GUNICORN_TIMEOUT=$GUNICORN_TIMEOUT
            GUNICORN_MAX_REQUESTS=$GUNICORN_MAX_REQUESTS
            GUNICORN_MAX_REQUESTS_JITTER=$GUNICORN_MAX_REQUESTS_JITTER
            REALTIME_SSE_ENABLED=$REALTIME_SSE_ENABLED
            TASKCENTRO_DEBUG_TOKEN=$TASKCENTRO_DEBUG_TOKEN
            INTERNAL_DEBUG_ENABLED=$INTERNAL_DEBUG_ENABLED
            STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY
            STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY
            STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET
            STRIPE_CURRENCY=$STRIPE_CURRENCY
            BILLING_CURRENCY=$BILLING_CURRENCY
            PAYPAL_ENV=$PAYPAL_ENV
            PAYPAL_ALLOW_SANDBOX=$PAYPAL_ALLOW_SANDBOX
            PAYPAL_CLIENT_ID=$PAYPAL_CLIENT_ID
            PAYPAL_CLIENT_SECRET=$PAYPAL_CLIENT_SECRET
            PAYPAL_WEBHOOK_ID=$PAYPAL_WEBHOOK_ID
            PAYPAL_MERCHANT_ID=$PAYPAL_MERCHANT_ID
            PAYPAL_CURRENCIES=$PAYPAL_CURRENCIES
            OLLAMA_API_KEY=$OLLAMA_API_KEY
            AI_PROVIDER_BACKEND=$AI_PROVIDER_BACKEND
            AI_MODEL=$AI_MODEL
            AI_TIMEOUT_SECONDS=$AI_TIMEOUT_SECONDS
            AI_DAILY_CALL_LIMIT=$AI_DAILY_CALL_LIMIT
            OLLAMA_BASE_URL=$OLLAMA_BASE_URL
            AI_MODEL_FAST=$AI_MODEL_FAST
            ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
            OPENAI_API_KEY=$OPENAI_API_KEY
            OPENAI_BASE_URL=$OPENAI_BASE_URL
            AI_AUTONOMY_ENABLED=$AI_AUTONOMY_ENABLED
            BACKUP_S3_BUCKET=$BACKUP_S3_BUCKET
            BACKUP_AWS_ACCESS_KEY_ID=$BACKUP_AWS_ACCESS_KEY_ID
            BACKUP_AWS_SECRET_ACCESS_KEY=$BACKUP_AWS_SECRET_ACCESS_KEY
            SEO_ALLOW_INDEXING=$SEO_ALLOW_INDEXING
            GOOGLE_ANALYTICS_ID=$GOOGLE_ANALYTICS_ID
            DJANGO_ENV=production
            INSTAGRAM_APP_ID=$INSTAGRAM_APP_ID
            INSTAGRAM_APP_SECRET=$INSTAGRAM_APP_SECRET
            INSTAGRAM_GRAPH_VERSION=$INSTAGRAM_GRAPH_VERSION
            INSTAGRAM_VERIFY_TOKEN=$INSTAGRAM_VERIFY_TOKEN
            HUBSPOT_CLIENT_ID=$HUBSPOT_CLIENT_ID
            HUBSPOT_CLIENT_SECRET=$HUBSPOT_CLIENT_SECRET
            SYSTEM_EMAIL_PROVIDER_BACKEND=$SYSTEM_EMAIL_PROVIDER_BACKEND

            ENVEOF

            chmod 600 .env

            # Builds every service the checked-out docker-compose.yml defines, not a fixed list, so a
            # rollback to a commit with different services still builds.
            release() {
              docker compose --profile prod build
              docker compose --profile prod run --rm web python manage.py migrate --noinput
              docker compose --profile prod run --rm web python manage.py collectstatic --noinput
              docker compose --profile prod up -d --remove-orphans
            }

            # Healthy once /healthz answers through gunicorn (up to 90s).
            healthy() {
              HOST=$(echo "$ALLOWED_HOSTS" | cut -d, -f1)
              for i in $(seq 1 18); do
                if curl -fsS -H "Host: $HOST" http://127.0.0.1:8000/healthz >/dev/null; then
                  return 0
                fi
                sleep 5
              done
              return 1
            }

            # Snapshot the database before migrations run, so a bad migration can be undone
            # (rollback below restores code only). Keeps the last 5 snapshots on the VPS.
            if docker compose ps --status running db | grep -q db; then
              mkdir -p backups/pre-deploy
              docker compose exec -T db pg_dump -Fc --no-owner -U "$POSTGRES_USER" "$POSTGRES_DB" \
                > "backups/pre-deploy/$(date -u +%Y%m%dT%H%M%SZ)-$PREV.dump"
              ls -1t backups/pre-deploy/*.dump | tail -n +6 | xargs -r rm -f
            fi

            release
            if ! healthy; then
              # Roll the code back to the last release. Migrations are not reversed, which is
              # safe only while they stay additive (new tables/nullable columns).
              echo "Health check failed; rolling back to $PREV"
              git reset --hard "$PREV"
              # `if` keeps set -e from ending the script mid-rollback; the job fails either way.
              if release && healthy; then
                echo "Rolled back to $PREV"
              else
                echo "Rollback failed or is unhealthy too - check 'docker compose logs web'"
              fi
              exit 1
            fi
            docker image prune -f

      - name: Invalidate CloudFront
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_ID }}" \
            --paths "/*"