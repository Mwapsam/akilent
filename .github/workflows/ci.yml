name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      # static/css/app.css is committed and is exactly what deploy.yml ships to
      # production - nothing rebuilds it on the server. Tailwind's build is
      # purge-scanned, so a template using a class no other template uses will
      # silently lose its styling unless the author rebuilt. Rebuild here and
      # compare. The comparison is order-insensitive on purpose: the standalone
      # CLI orders rules slightly differently on Windows and Linux, so a byte
      # diff would fail on every PR authored from Windows.
      - name: Verify compiled CSS is up to date
        run: |
          set -e
          curl -sSL -o "$RUNNER_TEMP/tailwindcss" "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x "$RUNNER_TEMP/tailwindcss"
          "$RUNNER_TEMP/tailwindcss" -i assets/app.css -o "$RUNNER_TEMP/app.built.css" --minify
          python tools/check_css_build.py "$RUNNER_TEMP/app.built.css" static/css/app.css
        env:
          TAILWIND_VERSION: "4.3.3"

      - name: Django deploy checks
        run: poetry run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: automator.settings_test

      - name: Run email tests
        # Email delivery / SES is reputation-critical — run it as its own step so
        # a regression here is unmistakable, and fail if any test is skipped.
        run: poetry run pytest apps/email -rs --strict-markers
        env:
          DJANGO_SETTINGS_MODULE: automator.settings_test

      - name: Run tests
        run: poetry run pytest
