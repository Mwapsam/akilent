name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      # static/css/app.css is committed and is exactly what deploy.yml ships to
      # production - nothing rebuilds it on the server. Tailwind's build is
      # purge-scanned, so a template using a class no other template uses will
      # silently lose its styling unless the author rebuilt. Rebuild here and
      # fail if the committed file is stale.
      - name: Verify compiled CSS is up to date
        run: |
          set -e
          curl -sSL -o /tmp/tailwindcss             https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64
          chmod +x /tmp/tailwindcss
          /tmp/tailwindcss -i assets/app.css -o /tmp/app.built.css --minify
          if ! diff -q /tmp/app.built.css static/css/app.css > /dev/null; then
            echo "::error file=static/css/app.css::Compiled CSS is stale. Run:"
            echo "  tools/tailwindcss -i assets/app.css -o static/css/app.css --minify"
            diff <(head -c 2000 static/css/app.css) <(head -c 2000 /tmp/app.built.css) || true
            exit 1
          fi
          echo "Compiled CSS matches assets/app.css."
        env:
          TAILWIND_VERSION: "4.3.3"

      - name: Django deploy checks
        run: poetry run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: automator.settings_test

      - name: Run email tests
        # Email delivery / SES is reputation-critical — run it as its own step so
        # a regression here is unmistakable, and fail if any test is skipped.
        run: poetry run pytest apps/email -rs --strict-markers
        env:
          DJANGO_SETTINGS_MODULE: automator.settings_test

      - name: Run tests
        run: poetry run pytest
