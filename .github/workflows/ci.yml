name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"          # caches the Poetry virtualenv

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      # ------------------------------------------------------------------
      # Quality gates (run early so we fail fast)
      # ------------------------------------------------------------------
      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Ruff (format check)
        run: poetry run ruff format --check .

      - name: mypy
        run: poetry run mypy .
        # If you prefer only the apps/ package:
        # run: poetry run mypy apps/

      # ------------------------------------------------------------------
      # Your existing steps (unchanged logic)
      # ------------------------------------------------------------------
      # static/css/app.css is committed and is exactly what deploy.yml ships to
      # production - nothing rebuilds it on the server. Tailwind's build is
      # purge-scanned, so a template using a class no other template uses will
      # silently lose its styling unless the author rebuilt. Rebuild here and
      # compare. The comparison is order-insensitive on purpose: the standalone
      # CLI orders rules slightly differently on Windows and Linux, so a byte
      # diff would fail on every PR authored from Windows.
      - name: Verify compiled CSS is up to date
        run: |
          set -e
          # -f: an HTTP error (GitHub's "504 Gateway Time-out" page) fails the download
          # instead of being saved and run as the binary; retried, since GitHub's release
          # CDN has the odd bad minute. Then check it really is an executable.
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "$RUNNER_TEMP/tailwindcss" \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          head -c 4 "$RUNNER_TEMP/tailwindcss" | grep -q "ELF" || { echo "Downloaded tailwindcss is not a Linux binary"; exit 1; }
          chmod +x "$RUNNER_TEMP/tailwindcss"
          "$RUNNER_TEMP/tailwindcss" -i assets/app.css -o "$RUNNER_TEMP/app.built.css" --minify
          python tools/check_css_build.py "$RUNNER_TEMP/app.built.css" static/css/app.css
          # The landing page's own stylesheet, on the same tokens (assets/tokens.css).
          "$RUNNER_TEMP/tailwindcss" -i assets/landing.css -o "$RUNNER_TEMP/landing.built.css" --minify
          python tools/check_css_build.py "$RUNNER_TEMP/landing.built.css" static/css/landing.css
        env:
          TAILWIND_VERSION: "4.3.3"

      - name: Django deploy checks
        run: poetry run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: automator.settings_test

      # Tests run with --nomigrations, so nothing else notices a model change that was
      # never given a migration, or a migration graph that no longer applies.
      - name: Migrations are complete
        run: poetry run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: automator.settings_test

      - name: Migrations apply from scratch
        run: poetry run python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: automator.settings_test

      - name: Run email tests
        # Email delivery / SES is reputation-critical — run it as its own step so
        # a regression here is unmistakable, and fail if any test is skipped.
        run: poetry run pytest apps/email -rs --strict-markers --reuse-db --nomigrations
        env:
          DJANGO_SETTINGS_MODULE: automator.settings_test

      - name: Run tests (correctness gate, blocks deploy)
        # --reuse-db + --nomigrations = big speed win
        # -n auto = parallel (requires pytest-xdist; remove the flag if you
        # haven't installed it yet)
        # Timing-sensitive tests are excluded here; they run in the
        # performance step below so contention cannot block a deploy.
        run: poetry run pytest --reuse-db --nomigrations -n auto -m "not performance and not serial"
        env:
          DJANGO_SETTINGS_MODULE: automator.settings_test

      - name: Run serial correctness tests (blocks deploy)
        # Threaded concurrency tests. Serial, so xdist workers cannot contend.
        run: poetry run pytest --reuse-db --nomigrations -n 0 -m serial
        env:
          DJANGO_SETTINGS_MODULE: automator.settings_test

      - name: Run performance tests (visible, non-blocking)
        # Serial, so the timing budget measures the code, not parallel contention.
        # continue-on-error keeps a budget miss visible without blocking deploy.
        continue-on-error: true
        run: poetry run pytest --reuse-db --nomigrations -n 0 -m performance
        env:
          DJANGO_SETTINGS_MODULE: automator.settings_test
  # The landing page's speed budget (docs/plans/landing-premium-global.md, Phase 0): Lighthouse
  # on the logged-out page, three runs, the median against lighthouserc.json (all four
  # categories at 90 or above, LCP under 2.5s, CLS under 0.05). A small nginx in front of
  # runserver compresses responses, as production's nginx and CloudFront do.
  lighthouse:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      USE_SQLITE: "1"
      DEBUG: "true"
      DJANGO_SECRET_KEY: lighthouse-only-secret
      REDIS_CACHE_URL: redis://127.0.0.1:6379/0
      REDIS_URL: redis://127.0.0.1:6379/0
      SEO_ALLOW_INDEXING: "true"
      WHATSAPP_ENABLED: "true"
      INSTAGRAM_ENABLED: "true"
      FACEBOOK_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev
      - name: Start the app
        run: |
          poetry run python manage.py migrate --noinput
          poetry run python manage.py runserver 127.0.0.1:8000 --noreload > runserver.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz >/dev/null && break; sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:8000/
      - name: Compress like production
        run: |
          sed 's/APP/127.0.0.1:8000/' .github/lighthouse/nginx.conf > "$RUNNER_TEMP/lh-nginx.conf"
          docker run -d --network host -v "$RUNNER_TEMP/lh-nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
          for i in $(seq 1 15); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsS -o /dev/null -H "Accept-Encoding: gzip" -D - http://127.0.0.1:8080/ | grep -i "content-encoding: gzip"
      - name: Lighthouse budget
        run: npx --yes @lhci/cli@0.14.0 autorun
      - name: Server log on failure
        if: failure()
        run: tail -100 runserver.log
