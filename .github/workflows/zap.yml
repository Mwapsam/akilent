name: ZAP

# ZAP scans live production — run manually only, not on every push, to avoid
# triggering WAF rules or probing real customer data on every deployment.
on:
  workflow_dispatch:

jobs:
  zap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://akilent.com"
          rules_file_name: ".zap/rules.tsv"
          fail_action: true