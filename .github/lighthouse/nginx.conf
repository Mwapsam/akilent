# Lighthouse CI only (.github/workflows/ci.yml, job "lighthouse"): compresses what the app
# serves, as production's nginx (nginx/conf.d/default.conf) and CloudFront do, so the budget
# measures the page as visitors receive it. APP is the app's address, set by the job.
server {
    listen 8080;
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    location / {
        proxy_pass http://APP;
        proxy_set_header Host 127.0.0.1;
    }
}
