{% extends "base.html" %}
{% block title %}Inbox — {{ site.app_name|default:"Automator" }}{% endblock %}

{% block content %}
<header class="mb-5 flex flex-wrap items-end justify-between gap-3">
  <div>
    <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-ink">Inbox</h1>
    <p class="mt-1 text-sm text-gray-600">Who is waiting on you, and for how long — across every channel.</p>
  </div>
  <div class="flex items-center gap-2">
    <a href="{% url 'conversations:followups_due' %}" class="btn btn-ghost btn-sm">Follow-ups due</a>
    <a href="{% url 'conversations:saved_replies' %}" class="btn btn-ghost btn-sm">Saved replies</a>
    <form method="get" class="flex items-center gap-2">
      <input type="hidden" name="view" value="{{ view }}" />
      <select name="channel" class="select w-40" onchange="this.form.submit()" aria-label="Filter by channel">
        <option value="">All channels</option>
        {% for value, label in channel_choices %}
          <option value="{{ value }}" {% if value == channel %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </form>
  </div>
</header>

<div id="inbox-body" data-feed-url="{% url 'conversations:inbox_feed' %}">
  {% include "conversations/_inbox_body.html" %}
</div>

<script>
  // Live refresh: re-render the tabs + list every few seconds while the tab is visible.
  (() => {
    const box = document.getElementById('inbox-body');
    let interval = 8000, timer = null;
    const schedule = (d) => { clearTimeout(timer); timer = setTimeout(poll, d ?? interval); };
    async function poll() {
      if (document.hidden) return;
      try {
        const r = await fetch(box.dataset.feedUrl + window.location.search, {
          credentials: 'same-origin',
          headers: { 'X-Requested-With': 'XMLHttpRequest', Accept: 'application/json' },
        });
        if (!r.ok) throw new Error(r.status);
        const { html } = await r.json();
        if (html.trim() !== box.innerHTML.trim()) {
          const top = window.scrollY;
          box.innerHTML = html;
          window.scrollTo({ top });
        }
        interval = 8000;
      } catch (e) {
        interval = Math.min(interval * 2, 60000);
      } finally {
        schedule();
      }
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) schedule(0); });
    schedule();
  })();
</script>
{% endblock %}
