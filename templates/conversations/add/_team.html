{% comment %}Add a team (modal from Inbox settings › Teams & routing, or its own page).{% endcomment %}
<form method="post" action="{% url 'conversations:teams' %}" class="space-y-3"{% if not in_overlay %} hx-boost="false"{% endif %}>
  {% csrf_token %}
  {% if error %}<p class="text-sm text-coral-700" role="alert">{{ error }}</p>{% endif %}
  <div>
    <label class="label" for="team-name">Name</label>
    <input id="team-name" name="name" class="input" placeholder="e.g. Sales" value="{{ values.name }}" required autofocus />
  </div>
  <p class="text-xs text-ink-subtle">Add people to it next, then send conversations to it with a routing rule.</p>
  <div class="flex justify-end gap-2">
    {% if in_overlay %}<button type="button" class="btn btn-ghost btn-sm" data-overlay-close>Cancel</button>{% else %}<a href="{% url 'conversations:inbox_settings_teams' %}" class="btn btn-ghost btn-sm">Cancel</a>{% endif %}
    <button class="btn btn-primary btn-sm">Add team</button>
  </div>
</form>
