{% comment %}A help article card. Needs: a (Article).{% endcomment %}
<a href="{% url 'help-article' a.slug %}" class="help-card">
  <span class="help-card-icon">
    {% include "components/icon.html" with name=a.icon class="w-5 h-5" %}
  </span>
  <span class="min-w-0">
    <span class="help-card-title">{{ a.title }}</span>
    <span class="help-card-summary">{{ a.summary }}</span>
  </span>
  <svg class="help-card-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
</a>
