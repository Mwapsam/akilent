{% comment %}A help category section. Needs: cat (name), items (articles).{% endcomment %}
<section class="help-section" id="{{ cat|slugify }}">
  <h2 class="help-section-title">{{ cat }} <span>{{ items|length }} guide{{ items|length|pluralize }}</span></h2>
  <div class="help-grid">
    {% for a in items %}{% include "help/_card.html" with a=a %}{% endfor %}
  </div>
</section>
