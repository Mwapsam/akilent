{% comment %}Illustration (journey, Engage): the chat in the shared inbox, assigned to a teammate,
with the closed-hours auto-reply that answered first (automation engagement starters).{% endcomment %}
<figure class="lp-art" data-art="thread" data-claim-exempt>
  <div role="img" aria-label="Illustration: a customer messages after hours, an automatic closed-hours reply answers, and in the morning a teammate assigned to the chat replies.">
    <div class="lp-window" aria-hidden="true">
      <div class="lp-convo-head">
        <span class="who"><span class="lp-av t">TM</span><span><strong>Thandi Mwale</strong><em>Assigned to Ruth</em></span></span>
        <span class="lp-chip lp-chip-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>WhatsApp</span>
      </div>
      <div class="lp-thread">
        <div class="lp-bub in">Hi, is the linen dress available in M?<small>21:40</small></div>
        <div class="lp-bub out">Thanks for your message! We're closed now and open again at 08:00.<small>21:40 · Auto-reply</small></div>
        <div class="lp-bub out">Good morning Thandi, yes, M is in stock.<small>08:05 · Ruth</small></div>
      </div>
    </div>
  </div>
  <figcaption class="lp-art-cap">Illustration of a conversation in the shared inbox.</figcaption>
</figure>
