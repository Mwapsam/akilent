{# Send-a-test-message form. Context: url, label, prefill. Handled by the [data-wa-verify] script in numbers.html. #}
<form class="mt-3 flex flex-wrap items-start gap-2" data-wa-verify action="{{ url }}" method="post">
  {% csrf_token %}
  <input name="recipient" type="tel" required value="{{ prefill }}" placeholder="+260 97 XXX XXXX"
         aria-label="Phone number to send the test to" class="input w-56">
  <button type="submit" class="btn btn-primary btn-sm">{{ label }}</button>
  <p class="w-full text-xs text-gray-400">We'll send a WhatsApp test message to this number. Replying isn't required.</p>
  <p data-wa-verify-result class="w-full text-sm hidden" role="status"></p>
</form>
