{% comment %}Command palette — ⌘K / Ctrl-K. Client-side fuzzy filter over nav
destinations + quick actions. No backend in v1.
Open programmatically with: window.dispatchEvent(new CustomEvent('palette-open')).
{% endcomment %}
<div x-data="commandPalette()"
     @keydown.window="onKey($event)"
     @palette-open.window="openPalette($event)">
  <template x-teleport="body">
    <div x-show="open" x-cloak class="fixed inset-0" style="z-index: var(--z-modal)"
         role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="absolute inset-0 bg-gray-900/50" x-transition.opacity
           @click="close()" aria-hidden="true"></div>

      <div class="absolute inset-x-4 top-[12vh] mx-auto max-w-xl sm:inset-x-0"
           x-trap.noscroll="open"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 -translate-y-2"
           x-transition:enter-end="opacity-100 translate-y-0">
        <div class="card shadow-modal overflow-hidden">
          <div class="flex items-center gap-2 px-3 border-b border-border">
            {% include "components/icon.html" with name="search" class="w-4 h-4 text-gray-400 shrink-0" %}
            <input type="text" x-model="q" x-ref="input"
                   @keydown.arrow-down.prevent="move(1)"
                   @keydown.arrow-up.prevent="move(-1)"
                   @keydown.enter.prevent="run()"
                   class="w-full bg-transparent py-3 text-sm text-ink placeholder:text-gray-400 focus:outline-none"
                   placeholder="Search pages and actions…"
                   aria-label="Search pages and actions">
            <kbd class="hidden sm:block text-[11px] text-gray-400 border border-border rounded px-1.5 py-0.5">esc</kbd>
          </div>

          <ul class="max-h-80 overflow-y-auto py-1.5" role="listbox">
            <template x-for="(item, i) in filtered" :key="item.label">
              <li>
                <a :href="item.href"
                   @mouseenter="active = i"
                   :class="active === i ? 'bg-brand-50 text-brand-700' : 'text-ink'"
                   class="flex items-center gap-3 px-3 py-2 text-sm">
                  <span class="text-gray-400" x-text="item.group"></span>
                  <span x-text="item.label" class="font-medium"></span>
                </a>
              </li>
            </template>
            <li x-show="filtered.length === 0" class="px-3 py-6 text-center text-sm text-gray-500">
              No matches
            </li>
          </ul>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
  function commandPalette() {
    return {
      open: false,
      q: "",
      active: 0,
      trigger: null, // Track the element that triggered open for focus return
      items: [
        { group: "Go to", label: "Dashboard", href: "/dashboard/" },
        { group: "Go to", label: "Campaigns", href: "/email/campaigns/" },
        { group: "Go to", label: "Scheduled", href: "/scheduled/" },
        { group: "Go to", label: "Templates", href: "/email/templates/" },
        { group: "Go to", label: "Automations", href: "/automations/" },
        { group: "Go to", label: "Contacts", href: "/contacts/" },
        { group: "Go to", label: "Email domains", href: "/email/domains/" },
        {% if WHATSAPP_ENABLED %}{ group: "Go to", label: "WhatsApp", href: "/whatsapp/numbers/" },{% endif %}
        { group: "Go to", label: "Insights", href: "/email/insights/" },
        { group: "Go to", label: "Activity log", href: "/logs/messages/" },
        { group: "Go to", label: "Billing", href: "/billing/plans/" },
        { group: "Go to", label: "Help & guides", href: "/help/" },
        { group: "Go to", label: "API docs", href: "/docs/" },
        { group: "Go to", label: "Settings", href: "{% url 'settings-profile' %}" },
        { group: "Action", label: "New campaign", href: "/email/campaigns/new/" },
        { group: "Action", label: "Schedule a send", href: "/email/campaigns/new/" },
        { group: "Action", label: "Add domain", href: "/email/domains/create/" },
        { group: "Action", label: "New template", href: "/email/templates/create/" },
        { group: "Action", label: "Invite teammate", href: "{% url 'settings-team' %}" },
      ],
      get filtered() {
        const q = this.q.trim().toLowerCase();
        if (!q) return this.items;
        return this.items.filter((it) =>
          (it.label + " " + it.group).toLowerCase().includes(q)
        );
      },
      onKey(e) {
        const k = e.key.toLowerCase();
        if ((e.metaKey || e.ctrlKey) && k === "k") { e.preventDefault(); this.openPalette(e); }
        else if (this.open && k === "escape") { this.close(); }
      },
      openPalette(e) {
        this.trigger = e && e.target; // Save the element that triggered open
        this.open = true; this.q = ""; this.active = 0;
        this.$nextTick(() => this.$refs.input && this.$refs.input.focus());
      },
      close() {
        this.open = false;
        // Return focus to the trigger that opened the palette
        if (this.trigger) { this.$nextTick(() => this.trigger.focus()); }
      },
      move(d) {
        const n = this.filtered.length;
        if (!n) return;
        this.active = (this.active + d + n) % n;
      },
      run() {
        const it = this.filtered[this.active];
        if (it) window.location.href = it.href;
      },
    };
  }
</script>
