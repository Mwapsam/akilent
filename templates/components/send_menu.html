{% comment %}Topbar "+ Send" action + channel-chooser modal.
Reinforces that Email and WhatsApp are channels of one product.
Deep-links into the composer come in Phase 4; v1 routes to the closest screen.
{% endcomment %}
<div x-data="{ open: false, trigger: null }" @keydown.escape.window="open = false" @send-menu-open.window="open = true">
  <button type="button"
          id="send-menu-trigger"
          class="btn btn-primary btn-sm"
          @click="trigger = $event.target; open = true"
          aria-haspopup="dialog"
          aria-controls="send-menu-dialog"
          :aria-expanded="open">
    {% include "components/icon.html" with name="plus" class="w-4 h-4" %}
    <span class="hidden sm:inline">Send</span>
  </button>

  <template x-teleport="body">
    <div id="send-menu-dialog"
         x-show="open"
         x-cloak
         class="fixed inset-0"
         style="z-index: var(--z-modal)"
         role="dialog"
         aria-modal="true"
         aria-label="Send a message"
         @modal-close="open = false; if (trigger) trigger.focus()">
      <div class="absolute inset-0 bg-gray-900/50" x-transition.opacity
           @click="open = false" aria-hidden="true"></div>

      <div class="absolute inset-x-4 top-20 mx-auto max-w-lg sm:inset-x-0"
           x-trap.noscroll="open"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 -translate-y-2"
           x-transition:enter-end="opacity-100 translate-y-0">
        <div class="card card-pad shadow-modal">
          <div class="flex items-start justify-between gap-4">
            <h2 class="text-lg font-semibold text-ink">What do you want to send?</h2>
            <button type="button" class="btn btn-ghost btn-icon btn-sm -mt-1 -mr-1"
                    @click="open = false; if (trigger) trigger.focus()" aria-label="Close">
              {% include "components/icon.html" with name="x" class="w-5 h-5" %}
            </button>
          </div>

          <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
            <a href="/email/campaigns/new/"
               class="card card-hover card-pad flex flex-col gap-2 no-underline">
              <span class="inline-flex w-10 h-10 items-center justify-center rounded-xl bg-amber-50 text-amber-700">
                {% include "components/icon.html" with name="mail" class="w-5 h-5" %}
              </span>
              <span class="font-semibold text-ink">Email</span>
              <span class="text-sm text-gray-600">Send an email campaign</span>
            </a>

            {% if WHATSAPP_ENABLED %}
            <a href="/whatsapp/numbers/"
               class="card card-hover card-pad flex flex-col gap-2 no-underline">
              <span class="inline-flex w-10 h-10 items-center justify-center rounded-xl bg-teal-50 text-teal-800">
                {% include "components/icon.html" with name="message-circle" class="w-5 h-5" %}
              </span>
              <span class="font-semibold text-ink">WhatsApp</span>
              <span class="text-sm text-gray-600">Send a WhatsApp message</span>
            </a>
            {% else %}
            <div class="card card-pad flex flex-col gap-2 opacity-60">
              <span class="inline-flex w-10 h-10 items-center justify-center rounded-xl bg-gray-100 text-gray-400">
                {% include "components/icon.html" with name="message-circle" class="w-5 h-5" %}
              </span>
              <span class="font-semibold text-ink">WhatsApp</span>
              <span class="badge badge-neutral w-fit">Not connected</span>
            </div>
            {% endif %}
          </div>

          <a href="/email/campaigns/new/"
             class="mt-3 nav-link w-full justify-start no-underline">
            {% include "components/icon.html" with name="clock" class="w-5 h-5 shrink-0" %}
            <span>Schedule a message</span>
          </a>
        </div>
      </div>
    </div>
  </template>
</div>
