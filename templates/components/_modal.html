{% comment %}Canonical modal chrome. Rendered by {% modal %} (apps/core/templatetags/ui.py).
Opens on:  window event "modal-open" whose detail === this modal's id.
Closes on: backdrop click, Esc, or  $dispatch('modal-close').
{% endcomment %}
<template x-teleport="body">
  <div x-data="{ open: false }"
       x-show="open"
       x-cloak
       @modal-open.window="if ($event.detail === '{{ id }}') { open = true; $nextTick(() => $el.querySelector('[autofocus],h2,button,input,[tabindex=\'0\']')?.focus()) }"
       @modal-close.window="open = false"
       @keydown.escape.window="open = false"
       class="fixed inset-0 overflow-y-auto"
       style="z-index: var(--z-modal)"
       role="dialog" aria-modal="true"
       {% if title %}aria-label="{{ title }}"{% else %}aria-label="Dialog"{% endif %}>

    {% comment %}The overlay scrolls, not the page: a dialog taller than a short
    screen (a phone, a laptop with the keyboard up) must still reach its buttons.{% endcomment %}
    <div class="fixed inset-0 bg-gray-900/50" x-transition.opacity
         @click="open = false" aria-hidden="true"></div>

    <div class="relative mx-4 my-16 sm:mx-auto sm:my-24 {{ size_class }}"
         x-trap.noscroll="open"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0">
      <div class="card shadow-modal">
        {% if title %}
          <div class="flex items-start justify-between gap-4 card-pad pb-0">
            <h2 class="text-lg font-semibold text-ink">{{ title }}</h2>
            <button type="button" class="btn btn-ghost btn-icon btn-sm -mt-1 -mr-1"
                    @click="open = false" aria-label="Close">
              {% include "components/icon.html" with name="x" class="w-5 h-5" %}
            </button>
          </div>
        {% endif %}
        <div class="card-pad">{{ slot }}</div>
        {% if footer %}
          <div class="card-pad pt-0 flex flex-wrap justify-end gap-2">{{ footer }}</div>
        {% endif %}
      </div>
    </div>
  </div>
</template>
