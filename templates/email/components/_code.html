{% comment %}One-time code box. Params: code.{% endcomment %}<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 24px;">
  <tr>
    <td align="center" style="background-color:#FAFBFC;border:1px solid #E8EDF3;border-radius:10px;padding:20px 16px;">
      <span style="font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#12182B;">{{ code }}</span>
    </td>
  </tr>
</table>
