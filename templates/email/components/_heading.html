{% comment %}Email heading. Params: text, (optional) eyebrow.{% endcomment %}{% if eyebrow %}<p style="margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#657089;">{{ eyebrow }}</p>{% endif %}
<h1 class="em-h1" style="margin:0 0 16px;font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-0.3px;color:#12182B;">{{ text }}</h1>
