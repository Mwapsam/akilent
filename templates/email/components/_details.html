{% comment %}Label/value rows (plan, amount, date...). Params: rows = iterable of (label, value) pairs.{% endcomment %}<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 24px;border:1px solid #E8EDF3;border-radius:10px;border-collapse:separate;">
  {% for label, value in rows %}
  <tr>
    <td style="padding:12px 16px;font-size:14px;line-height:1.5;color:#657089;{% if not forloop.last %}border-bottom:1px solid #E8EDF3;{% endif %}" width="40%">{{ label }}</td>
    <td style="padding:12px 16px;font-size:14px;line-height:1.5;font-weight:600;color:#12182B;text-align:right;{% if not forloop.last %}border-bottom:1px solid #E8EDF3;{% endif %}">{{ value }}</td>
  </tr>
  {% endfor %}
</table>
