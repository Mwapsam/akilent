{% comment %}Bulletproof button (a padded link inside a table cell, works in Outlook). Params: url, label.{% endcomment %}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 24px;">
  <tr>
    <td align="center" bgcolor="#12182B" style="border-radius:8px;background-color:#12182B;">
      <a href="{{ url }}" target="_blank" style="display:inline-block;padding:13px 26px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;line-height:1.2;color:#ffffff;text-decoration:none;border-radius:8px;">{{ label }}</a>
    </td>
  </tr>
</table>
