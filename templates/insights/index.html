{% extends "base.html" %}
{% block title %}Insights — {{ site.app_name|default:"Akilent" }}{% endblock %}

{% block content %}
<header class="mb-6 flex items-start justify-between flex-wrap gap-3">
  <div>
    <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-ink">Insights</h1>
    <p class="mt-1 text-sm text-ink-muted">What Akilent is doing for your business.</p>
  </div>
  <form method="get" class="flex items-center gap-2"
        x-data="{ busy: false }" @submit="busy = true">
    <label class="sr-only" for="period">Period</label>
    <select id="period" name="period" class="select" onchange="this.form.requestSubmit()"
            :disabled="busy">
      {% for choice in period_choices %}
        <option value="{{ choice }}" {% if choice == days %}selected{% endif %}>
          Last {{ choice }} days{% if choice == 90 and period_locked %} (upgrade){% endif %}
        </option>
      {% endfor %}
    </select>
  </form>
</header>

{% include "insights/_body.html" %}
{% endblock %}
