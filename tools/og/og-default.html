<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url("../../static/fonts/inter-variable.woff2") format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Inter,Arial,sans-serif;background:#0E1526;color:#F3F5F7;position:relative;padding:72px 80px}
.glow{position:absolute;inset:0;background:radial-gradient(620px 420px at 92% 8%,rgba(67,191,172,.30),transparent 70%),radial-gradient(560px 420px at 78% 110%,rgba(110,138,180,.32),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(243,245,247,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(243,245,247,.05) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(115deg,transparent 35%,#000 100%)}
.brand{position:relative;display:flex;align-items:center;gap:16px;font-size:34px;font-weight:700;letter-spacing:-.02em}
.brand img{width:52px;height:52px}
h1{position:relative;margin-top:64px;max-width:900px;font-size:68px;line-height:1.06;font-weight:700;letter-spacing:-.035em}
h1 em{font-style:normal;color:#43BFAC}
.foot{position:absolute;left:80px;right:80px;bottom:64px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:rgba(243,245,247,.72)}
.pill{padding:12px 22px;border-radius:999px;background:#FFB020;color:#0E1526;font-weight:700;font-size:22px}
</style></head><body><div class="glow"></div><div class="grid"></div>
<div class="brand"><img src="../../static/img/brand/icon-color-on-dark.svg" alt="">Akilent</div>
<h1>The customer conversation platform for teams that <em>sell through chat</em></h1>
<div class="foot"><span>akilent.com</span><span class="pill">Start free trial</span></div>
</body></html>
