[project]
name = "automator"
version = "0.1.0"
description = "WhatsApp - automation engine"
authors = [
    {name = "Mwapsam", email = "mwapsam@gmail.com"}
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "cryptography (>=48.0.1,<49.0.0)",
    "phonenumbers (>=9.0.32,<10.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9,<3.0)",
    "celery[redis] (>=5.4,<6.0)",
    "redis (>=5.0,<6.0)",
    "requests (>=2.31,<3.0)",
    "b24pysdk[django] (>=1.1.4,<2.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "gunicorn (>=23.0,<24.0)",
    "sentry-sdk[django] (>=2.0,<3.0)",
    "dnspython (>=2.8.0,<3.0.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
    "djangorestframework (>=3.16,<4.0)",
    "markdown (>=3.10.2,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "boto3 (>=1.26.0,<2.0.0)",
    "django-storages (>=1.14,<2.0)",
    "aiosmtpd (>=1.4.0,<2.0.0)",
    "moto (>=5.2.3,<6.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "python-dateutil (>=2.9,<3.0)",
    "stripe (>=15.6.1,<16.0.0)",
    "uvicorn-worker (>=0.3,<1.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.0,<9.0)",
    "pytest-django (>=4.8,<5.0)",
    "mcp (>=2.1.1,<3.0.0)",
    # Quality tools
    "ruff (>=0.9.0)",
    "mypy (>=1.14.0)",
    "django-stubs (>=5.1)",
    "types-requests",
    "types-python-dateutil",
    "pre-commit (>=4.0)",
    "pytest-asyncio (>=0.24,<1.0)",
]

# ---------------------------------------------------------------------------
# pytest (kept + slightly tightened)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "automator.settings_test"
python_files = ["test_*.py", "tests.py", "*_test.py"]
testpaths = ["apps"]
addopts = "-q --import-mode=importlib --strict-markers"

# ---------------------------------------------------------------------------
# Ruff – lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 88
src = ["apps", "automator", "tools"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "RUF",    # ruff-specific
    "S",      # bandit (security)
    "ASYNC",  # flake8-async
    "BLE",    # flake8-blind-except
    "DTZ",    # flake8-datetimez
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PL",     # pylint
]
ignore = [
    "E501",    # line length handled by the formatter
    "S101",    # assert is fine in tests

    # Django patterns — cannot be removed without breaking circular-import chains
    "PLC0415", # deferred imports are the standard Django circular-import fix
    "RUF012",  # Django Meta / Admin attrs are intentionally mutable class vars

    # Framework interface methods must match fixed signatures (Django, Celery, DRF …)
    "ARG001",
    "ARG002",

    # Intentional broad except handlers (context processors, task retries, webhooks)
    "BLE001",

    # Complexity thresholds — domain logic legitimately exceeds ruff's defaults
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR0917", # too many positional arguments
    "PLR2004", # magic values: HTTP codes, DB limits, counts are self-documenting

    # Type-annotation housekeeping — reorganising TYPE_CHECKING blocks is risky
    "TC001",
    "TC003",

    # Style preferences the team has not adopted
    "SIM117",  # nested-with merging
    "PLW0108", # trivial lambda
    "RET504",  # assignment before return
    "SIM108",  # ternary operator
    "SIM102",  # nested if
    "SIM105",  # contextlib.suppress
    "C408",    # dict() literal
    "B905",    # zip() strict= parameter

    # False positives / low-signal rules
    "S104",    # "0.0.0.0" in a string check, not a socket bind
    "N818",    # Exception name convention — renaming is a breaking change
    "PLW2901", # loop variable overwritten (common deliberate pattern)
    "PLW0603", # global statement (used in app startup)
    "RUF002",  # docstring unicode quotes
    "RUF022",  # __all__ ordering
    "DTZ001",  # naive datetime — many are intentional UTC literals
    "DTZ007",  # naive datetime strptime
    "ERA001",  # commented-out code (work-in-progress sections)
    "B007",    # loop variable unused in loop body
    "E741",    # ambiguous variable name
    "N806",    # uppercase variable in function (imported class names)
    "A002",    # argument shadows builtin
    "A005",    # module shadows builtin
    "RET503",  # missing explicit return
    "RUF005",  # collection concatenation
    "RUF007",  # chained or
    "RUF013",  # implicit Optional
    "RUF021",  # unnecessary nested union
    "S303",    # MD5 / SHA1 (false positives in test helpers)
    "S308",    # mark_safe (template helpers)
    "S324",    # hashlib insecure hash (legacy code)
    "S608",    # SQL injection (false positives with ORM strings)

    # try/except/pass is an intentional silent fallback in context processors & views
    "S110",
    # false positives: Redis keys and enum values with TOKEN/KEY in their names
    "S105",
    "S112",    # try/except/continue
    # Unused lambda args (tool-call registries use fixed call signatures)
    "ARG005",
    # Async framework patterns
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",
    "ARG",
    "PLR2004",
    # Legacy unittest-style test suite — migrating 700+ assertions is out of scope
    "PT009",
    "PT027",
    "PT011",
    "PT022",
    # Style preferences in tests
    "PT018",   # compound assertions
    "PT006",   # parametrize string type
    "RUF059",  # unused unpacked variable
    # Test fixtures use short fixed passwords by design
    "S105",
    "S106",
    "S107",
    # Exception chaining less critical in test helpers
    "B904",
    # Mock/stub class names are intentionally lowercase
    "N801",
    "N802",
    "N817",
    "N812",
    # pytest.raises without match= is fine in simple smoke tests
    "B017",
    # pathlib migration in test helpers is out of scope
    "PTH118",
    "PTH123",
    # % format strings in legacy test helpers
    "UP031",
    # builtins shadowed in test fixtures
    "A001",
]
"**/migrations/**" = ["E501", "N806", "RUF012", "E402"]
"**/settings*.py" = ["F403", "F405", "PTH118"]
# Provider __init__.py files must import after settings are loaded
"apps/*/providers/__init__.py" = ["E402"]
"apps/automation/models.py" = ["E402"]
# Management commands — subprocess and open() calls are intentional
"apps/whatsapp/management/commands/*.py" = ["S607", "PTH123"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "automator"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy (strict + Django)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = [
    "migrations/",
    "tests/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = [
    "b24pysdk.*",
    "celery.*",
    "stripe.*",
    "moto.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "automator.settings_test"