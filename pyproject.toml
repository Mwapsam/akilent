[project]
name = "automator"
version = "0.1.0"
description = "WhatsApp - automation engine"
authors = [
    {name = "Mwapsam", email = "mwapsam@gmail.com"}
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "cryptography (>=48.0.1,<49.0.0)",
    "phonenumbers (>=9.0.32,<10.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9,<3.0)",
    "celery[redis] (>=5.4,<6.0)",
    "redis (>=5.0,<6.0)",
    "requests (>=2.31,<3.0)",
    "b24pysdk[django] (>=1.1.4,<2.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "gunicorn (>=23.0,<24.0)",
    "sentry-sdk[django] (>=2.0,<3.0)",
    "dnspython (>=2.8.0,<3.0.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
    "djangorestframework (>=3.16,<4.0)",
    "markdown (>=3.10.2,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "boto3 (>=1.26.0,<2.0.0)",
    "django-storages (>=1.14,<2.0)",
    "aiosmtpd (>=1.4.0,<2.0.0)",
    "moto (>=5.2.3,<6.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "python-dateutil (>=2.9,<3.0)",
    "stripe (>=15.6.1,<16.0.0)",
    "uvicorn-worker (>=0.3,<1.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.0,<9.0)",
    "pytest-django (>=4.8,<5.0)",
    "mcp (>=2.1.1,<3.0.0)",
    # Quality tools
    "ruff (>=0.9.0)",
    "mypy (>=1.14.0)",
    "django-stubs (>=5.1)",
    "types-requests",
    "types-python-dateutil",
    "pre-commit (>=4.0)",
    "pytest-asyncio (>=0.24,<1.0)",
]

# ---------------------------------------------------------------------------
# pytest (kept + slightly tightened)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "automator.settings_test"
python_files = ["test_*.py", "tests.py", "*_test.py"]
testpaths = ["apps"]
addopts = "-q --import-mode=importlib --strict-markers"

# ---------------------------------------------------------------------------
# Ruff – lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 88
src = ["apps", "automator", "tools"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "RUF",    # ruff-specific
    "S",      # bandit (security)
    "ASYNC",  # flake8-async
    "BLE",    # flake8-blind-except
    "DTZ",    # flake8-datetimez
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PL",     # pylint
]
ignore = [
    "E501",   # line length handled by the formatter
    "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ARG", "PLR2004"]
"**/migrations/**" = ["E501", "N806", "RUF012"]  # Django migrations are noisy
"**/settings*.py" = ["F403", "F405"]             # star-imports in settings

[tool.ruff.lint.isort]
known-first-party = ["apps", "automator"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy (strict + Django)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = [
    "migrations/",
    "tests/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = [
    "b24pysdk.*",
    "celery.*",
    "stripe.*",
    "moto.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "automator.settings_test"