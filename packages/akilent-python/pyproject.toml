[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akilent"
version = "0.1.0"
description = "Official Python SDK for the Akilent email API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Akilent" }]
dependencies = ["httpx>=0.24,<1"]

[project.urls]
Homepage = "https://akilent.com"
Documentation = "https://akilent.com/docs"

[project.optional-dependencies]
dev = ["pytest>=7", "respx>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/akilent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
